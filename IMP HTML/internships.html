<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Internships | InternHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body class="bg-slate-50 flex min-h-screen">
    <!-- Navigation Sidebar (Reused from Dashboard) -->
    <!-- ... [Include Sidebar from Dashboard] ... -->

    <main class="flex-1 p-4 md:p-8 space-y-6 overflow-y-auto">
        <!-- Page Header -->
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
            <h2 class="text-3xl font-bold text-slate-800">Explore Opportunities</h2>
            <div class="flex gap-2">
                <select class="px-4 py-2 rounded-lg border-slate-200 text-sm focus:ring-indigo-500 focus:border-indigo-500">
                    <option>Sort by: Newest</option>
                    <option>Stipend: High to Low</option>
                    <option>Deadline: Soonest</option>
                </select>
            </div>
        </div>

        <div class="grid lg:grid-cols-4 gap-8">
            <!-- Sidebar Filters -->
            <aside class="space-y-6">
                <div class="bg-white p-6 rounded-2xl border border-slate-200">
                    <h3 class="font-bold mb-4">Filters</h3>
                    
                    <div class="space-y-4">
                        <div>
                            <label class="text-sm font-semibold text-slate-700">Work Mode</label>
                            <div class="mt-2 space-y-2">
                                <label class="flex items-center gap-2 text-sm text-slate-600">
                                    <input type="checkbox" class="rounded text-indigo-600"> Remote
                                </label>
                                <label class="flex items-center gap-2 text-sm text-slate-600">
                                    <input type="checkbox" class="rounded text-indigo-600"> On-site
                                </label>
                                <label class="flex items-center gap-2 text-sm text-slate-600">
                                    <input type="checkbox" class="rounded text-indigo-600"> Hybrid
                                </label>
                            </div>
                        </div>

                        <div class="pt-4 border-t border-slate-100">
                            <label class="text-sm font-semibold text-slate-700">Duration</label>
                            <select class="mt-2 w-full px-3 py-2 rounded-lg border border-slate-200 text-sm">
                                <option>Any duration</option>
                                <option>1-3 Months</option>
                                <option>6 Months</option>
                            </select>
                        </div>
                    </div>
                </div>
            </aside>


             <!-- Jobs List -->
            <div class="lg:col-span-3 space-y-4" id="internshipList">
                <!-- Single Job Card (Example) -->
                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm card-hover flex flex-col md:flex-row gap-6">
                    <div class="w-16 h-16 bg-blue-100 rounded-2xl flex items-center justify-center text-blue-600 text-2xl flex-shrink-0">
                        <i class="fas fa-building"></i>
                    </div>
                    <div class="flex-1">
                        <div class="flex flex-col md:flex-row md:items-center justify-between gap-2">
                            <h3 class="text-xl font-bold text-slate-800">Senior Frontend Architect Intern</h3>
                            <span class="text-indigo-600 font-bold">$500 - $800 /mo</span>
                        </div>
                        <p class="text-slate-500 font-medium">TechNova Solutions • Dhaka, BD (Remote)</p>
                        
                        <div class="flex flex-wrap gap-2 mt-4">
                            <span class="px-3 py-1 bg-slate-100 text-slate-600 rounded-full text-xs">React</span>
                            <span class="px-3 py-1 bg-slate-100 text-slate-600 rounded-full text-xs">TypeScript</span>
                            <span class="px-3 py-1 bg-slate-100 text-slate-600 rounded-full text-xs">Tailwind</span>
                        </div>
                        
                        <div class="flex items-center justify-between mt-6 pt-6 border-t border-slate-50">
                            <span class="text-slate-400 text-xs"><i class="far fa-clock mr-1"></i> Posted 2 days ago</span>
                            <div class="flex gap-3">
                                <button class="p-2 text-slate-400 hover:text-red-500 transition"><i class="far fa-heart"></i></button>
                                <button onclick="openApplyModal()" class="px-6 py-2 bg-indigo-600 text-white rounded-lg text-sm font-bold">Apply Now</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Repeat Job Card 10+ times dynamically with JS -->
            </div>
        </div>
    </main>
