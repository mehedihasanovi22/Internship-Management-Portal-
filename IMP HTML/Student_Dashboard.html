<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Student Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body class="bg-slate-50 flex min-h-screen">

    <!-- Mobile Sidebar Backdrop -->
    <div id="sidebarBackdrop" onclick="toggleSidebar()" class="fixed inset-0 bg-slate-900/50 z-40 hidden md:hidden"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 w-72 bg-slate-900 text-slate-400 z-50 transition-transform -translate-x-full md:translate-x-0 md:static flex flex-col">
        <div class="p-6 flex items-center gap-3">
            <div class="bg-indigo-600 p-2 rounded-lg text-white">
                <i class="fas fa-graduation-cap"></i>
            </div>
            <span class="text-white text-xl font-bold">InternHub</span>
        </div>

        <nav class="flex-1 px-4 space-y-2 mt-4">
            <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 bg-indigo-600 text-white rounded-xl">
                <i class="fas fa-home"></i> <span>Overview</span>
            </a>
            <a href="internships.html" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-800 hover:text-white rounded-xl transition">
                <i class="fas fa-search"></i> <span>Find Internships</span>
            </a>
            <a href="applications.html" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-800 hover:text-white rounded-xl transition">
                <i class="fas fa-paper-plane"></i> <span>My Applications</span>
            </a>
            <a href="interviews.html" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-800 hover:text-white rounded-xl transition">
                <i class="fas fa-calendar-alt"></i> <span>Interviews</span>
            </a>
            <a href="resume.html" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-800 hover:text-white rounded-xl transition">
                <i class="fas fa-file-alt"></i> <span>Resume / Portfolio</span>
            </a>
            <div class="pt-4 pb-2 text-xs font-semibold uppercase text-slate-500 px-4">Account</div>
            <a href="profile.html" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-800 hover:text-white rounded-xl transition">
                <i class="fas fa-user"></i> <span>My Profile</span>
            </a>
            <a href="notifications.html" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-800 hover:text-white rounded-xl transition">
                <i class="fas fa-bell"></i> <span>Notifications</span>
            </a>
            <a href="settings.html" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-800 hover:text-white rounded-xl transition">
                <i class="fas fa-cog"></i> <span>Settings</span>
            </a>
        </nav>


        <!-- Role Switcher -->
        <div class="p-4 border-t border-slate-800">
            <button onclick="AppState.switchRole('company')" class="w-full flex items-center justify-between px-4 py-3 bg-slate-800 rounded-xl hover:bg-slate-700 transition">
                <div class="flex items-center gap-2">
                    <i class="fas fa-exchange-alt text-indigo-400"></i>
                    <span class="text-sm font-medium">Switch to Company</span>
                </div>
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col min-w-0">
        <!-- Top Navbar -->
        <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-4 md:px-8">
            <button onclick="toggleSidebar()" class="md:hidden text-slate-500 p-2"><i class="fas fa-bars"></i></button>
            
            <div class="relative max-w-md w-full hidden sm:block">
                <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                <input type="text" placeholder="Search internships..." class="w-full pl-10 pr-4 py-2 bg-slate-100 border-none rounded-lg text-sm focus:ring-2 focus:ring-indigo-100 outline-none">
            </div>

            <div class="flex items-center gap-4">
                <button class="relative p-2 text-slate-400 hover:text-indigo-600 transition">
                    <i class="fas fa-bell"></i>
                    <span class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full border-2 border-white"></span>
                </button>
                <div class="h-8 w-px bg-slate-200"></div>
                <div class="flex items-center gap-3 group cursor-pointer" onclick="toggleDropdown()">
                    <div class="text-right hidden sm:block">
                        <div class="text-sm font-bold text-slate-800">Mehedi Hasan</div>
                        <div class="text-xs text-slate-500">Student Account</div>
                    </div>
                    <img src="https://i.pravatar.cc/150?u=mehedi" class="w-10 h-10 rounded-xl border-2 border-white shadow-sm" alt="avatar">
                </div>
            </div>
        </header>


         <!-- Dashboard Content -->
        <div class="p-4 md:p-8 space-y-8 overflow-y-auto">
            <!-- Welcome Header -->
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div>
                    <h2 class="text-2xl font-bold text-slate-800">Hello, Mehedi 👋</h2>
                    <p class="text-slate-500">Here's what's happening with your applications today.</p>
                </div>
                <div class="flex gap-3">
                    <a href="internships.html" class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm font-bold shadow-lg shadow-indigo-100">Find New Jobs</a>
                </div>
            </div>
