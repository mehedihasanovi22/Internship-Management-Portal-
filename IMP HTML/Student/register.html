<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration - Internship Management Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50: '#eef2ff', 600: '#4f46e5', 700: '#4338ca' }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col justify-between">

  <!-- Header -->
  <header class="py-6 px-6 max-w-7xl mx-auto w-full flex items-center justify-between">
    <a href="../../index.html" class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-bold">
        <i class="fa-solid fa-graduation-cap"></i>
      </div>
      <span class="text-xl font-bold font-heading text-slate-900 dark:text-white">INTERN<span class="text-indigo-600">PORTAL</span></span>
    </a>
    <div class="flex items-center gap-3">
      <button class="theme-toggle-btn p-2 rounded-xl border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300">
        <i class="fa-regular fa-moon dark:hidden"></i>
        <i class="fa-regular fa-sun hidden dark:block text-amber-400"></i>
      </button>
      <a href="login.html" class="text-xs font-semibold text-indigo-600 dark:text-indigo-400 hover:underline">Already have an account? Sign In &rarr;</a>
    </div>
  </header>

  <!-- Register Form Container -->
  <main class="flex-1 flex items-center justify-center p-4 py-8">
    <div class="w-full max-w-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-3xl p-8 shadow-xl">
      <div class="text-center mb-8">
        <div class="w-12 h-12 rounded-2xl bg-indigo-50 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-400 flex items-center justify-center mx-auto mb-3 text-xl">
          <i class="fa-solid fa-user-plus"></i>
        </div>
        <h1 class="text-2xl font-bold font-heading text-slate-900 dark:text-white">Student Registration</h1>
        <p class="text-xs text-slate-500 mt-1">Join the university placement network to discover top tech internships</p>
      </div>

      <form id="student-reg-form" onsubmit="event.preventDefault(); handleStudentRegister(this);" class="space-y-4">
        <!-- Personal Info -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">Full Name *</label>
            <input type="text" id="reg-name" required placeholder="e.g. Mehedi Hasan" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-xs text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500" />
          </div>
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">Student ID *</label>
            <input type="text" id="reg-id" required placeholder="e.g. 2022000000101" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-xs text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500" />
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">Institutional Email *</label>
            <input type="email" id="reg-email" required placeholder="student.cse@university.edu.bd" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-xs text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500" />
          </div>
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">Phone Number *</label>
            <input type="tel" id="reg-phone" required placeholder="+880 1712-345678" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-xs text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500" />
          </div>
        </div>
