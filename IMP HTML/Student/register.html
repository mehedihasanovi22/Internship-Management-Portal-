<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration - Internship Management Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50: '#eef2ff', 600: '#4f46e5', 700: '#4338ca' }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col justify-between">

  <!-- Header -->
  <header class="py-6 px-6 max-w-7xl mx-auto w-full flex items-center justify-between">
    <a href="../../index.html" class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-bold">
        <i class="fa-solid fa-graduation-cap"></i>
      </div>
      <span class="text-xl font-bold font-heading text-slate-900 dark:text-white">INTERN<span class="text-indigo-600">PORTAL</span></span>
    </a>
    <div class="flex items-center gap-3">
      <button class="theme-toggle-btn p-2 rounded-xl border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300">
        <i class="fa-regular fa-moon dark:hidden"></i>
        <i class="fa-regular fa-sun hidden dark:block text-amber-400"></i>
      </button>
      <a href="login.html" class="text-xs font-semibold text-indigo-600 dark:text-indigo-400 hover:underline">Already have an account? Sign In &rarr;</a>
    </div>
  </header>

  <!-- Register Form Container -->
  <main class="flex-1 flex items-center justify-center p-4 py-8">
    <div class="w-full max-w-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-3xl p-8 shadow-xl">
      <div class="text-center mb-8">
        <div class="w-12 h-12 rounded-2xl bg-indigo-50 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-400 flex items-center justify-center mx-auto mb-3 text-xl">
          <i class="fa-solid fa-user-plus"></i>
        </div>
        <h1 class="text-2xl font-bold font-heading text-slate-900 dark:text-white">Student Registration</h1>
        <p class="text-xs text-slate-500 mt-1">Join the university placement network to discover top tech internships</p>
      </div>

      <form id="student-reg-form" onsubmit="event.preventDefault(); handleStudentRegister(this);" class="space-y-4">
        <!-- Personal Info -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">Full Name *</label>
            <input type="text" id="reg-name" required placeholder="e.g. Mehedi Hasan" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-xs text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500" />
          </div>
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">Student ID *</label>
            <input type="text" id="reg-id" required placeholder="e.g. 2022000000101" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-xs text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500" />
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">Institutional Email *</label>
            <input type="email" id="reg-email" required placeholder="student.cse@university.edu.bd" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-xs text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500" />
          </div>
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">Phone Number *</label>
            <input type="tel" id="reg-phone" required placeholder="+880 1712-345678" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-xs text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500" />
          </div>
        </div>

        <!-- Academic Info -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">Department *</label>
            <select id="reg-dept" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-xs text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
              <option>Computer Science & Engineering</option>
              <option>Software Engineering</option>
              <option>Information Technology</option>
              <option>Electrical & Electronic Engineering</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">Semester</label>
            <select id="reg-semester" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-xs text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
              <option>5th Semester</option>
              <option>6th Semester</option>
              <option selected>7th Semester</option>
              <option>8th Semester</option>
              <option>Graduate</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">Current CGPA *</label>
            <input type="number" step="0.01" min="2.0" max="4.0" id="reg-cgpa" required placeholder="3.85" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-xs text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">Key Technical Skills (comma separated)</label>
          <input type="text" id="reg-skills" placeholder="React, Node.js, Python, Tailwind, Git, SQL" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-xs text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>

        <!-- Password -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">Create Password *</label>
            <input type="password" id="reg-pw" required placeholder="At least 6 characters" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-xs text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500" />
          </div>
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">Confirm Password *</label>
            <input type="password" id="reg-cpw" required placeholder="Repeat password" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-xs text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500" />
          </div>
        </div>

        <div class="pt-2">
          <label class="flex items-start gap-2 cursor-pointer text-xs text-slate-600 dark:text-slate-400">
            <input type="checkbox" required class="mt-0.5 rounded text-indigo-600 focus:ring-indigo-500" />
            <span>I agree to the university internship placement terms, code of conduct, and corporate privacy policies.</span>
          </label>
        </div>

        <button type="submit" class="w-full py-3.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs shadow-md shadow-indigo-600/25 transition">
          Complete Registration & Go to Dashboard
        </button>
      </form>

      <div class="mt-6 text-center text-xs text-slate-500">
        Looking to hire students instead?
        <a href="../company/register.html" class="font-bold text-indigo-600 dark:text-indigo-400 hover:underline">Register Company Account</a>
      </div>
    </div>
  </main>

  <footer class="py-6 text-center text-xs text-slate-400 border-t border-slate-200 dark:border-slate-800">
    © 2026 Internship Management Portal • University CSE Project
  </footer>

  <script src="../../js/main.js"></script>
  <script src="../../js/ui.js"></script>
  <script>
    function handleStudentRegister(form) {
      const pw = document.getElementById('reg-pw').value;
      const cpw = document.getElementById('reg-cpw').value;
      if (pw !== cpw) {
        showToast('Passwords do not match!', 'error');
        return;
      }

      const newStudent = {
        id: `std-${Date.now()}`,
        name: document.getElementById('reg-name').value.trim(),
        studentId: document.getElementById('reg-id').value.trim(),
        email: document.getElementById('reg-email').value.trim(),
        phone: document.getElementById('reg-phone').value.trim(),
        department: document.getElementById('reg-dept').value,
        semester: document.getElementById('reg-semester').value,
        cgpa: document.getElementById('reg-cgpa').value,
        skills: document.getElementById('reg-skills').value.split(',').map(s => s.trim()).filter(Boolean),
        university: "University Department of Computer Science & Engineering",
        location: "Dhaka, Bangladesh",
        graduationYear: "2026",
        avatar: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300&auto=format&fit=crop&q=80",
        bio: "Passionate Computer Science student looking for full-stack and AI internship opportunities.",
        resume: {
          fileName: "Resume_Draft.pdf",
          fileSize: "1.2 MB",
          uploadDate: new Date().toISOString().split('T')[0],
          status: "Verified"
        }
      };

      DB.saveStudentProfile(newStudent);
      showToast('Account created successfully! Welcome to the portal 🎉', 'success');
      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 800);
    }
  </script>
</body>
</html>
