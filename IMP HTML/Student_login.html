<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login | InternLink</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body class="bg-slate-50 dark:bg-slate-900 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white dark:bg-slate-800 rounded-3xl shadow-2xl overflow-hidden border border-slate-100 dark:border-slate-700 animate-fade-in">
        <div class="p-8">
            <div class="text-center mb-8">
                <a href="../../index.html" class="inline-flex items-center gap-2 mb-6">
                    <div class="bg-primary-600 p-2 rounded-lg">
                        <i class="fas fa-graduation-cap text-white text-xl"></i>
                    </div>
                    <span class="text-2xl font-bold dark:text-white">InternLink</span>
                </a>
                <h2 class="text-2xl font-bold dark:text-white">Student Login</h2>
                <p class="text-slate-500 mt-2">Welcome back! Please enter your details.</p>
            </div>

            <form id="loginForm" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium mb-2 dark:text-slate-300">Email Address</label>
                    <div class="relative">
                        <i class="fas fa-envelope absolute left-4 top-4 text-slate-400"></i>
                        <input type="email" value="mehedi@example.com" class="w-full pl-12 pr-4 py-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-primary-500 outline-none transition dark:text-white" placeholder="name@email.com">
                    </div>
                </div>
                <div>
                    <div class="flex justify-between mb-2">
                        <label class="text-sm font-medium dark:text-slate-300">Password</label>
                        <a href="#" class="text-sm text-primary-600 hover:underline">Forgot password?</a>
                    </div>
                    <div class="relative">
                        <i class="fas fa-lock absolute left-4 top-4 text-slate-400"></i>
                        <input type="password" value="123456" class="w-full pl-12 pr-4 py-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-primary-500 outline-none transition dark:text-white" placeholder="••••••••">
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <input type="checkbox" id="remember" class="w-4 h-4 rounded border-slate-300 text-primary-600">
                    <label for="remember" class="text-sm text-slate-600 dark:text-slate-400">Remember me for 30 days</label>
                </div>
                <button type="submit" class="w-full bg-primary-600 text-white py-3 rounded-xl font-bold hover:bg-primary-700 transition transform hover:scale-[1.02] shadow-lg shadow-primary-500/25">
                    Sign In
                </button>
            </form>

            <div class="mt-8 pt-8 border-t border-slate-100 dark:border-slate-700 text-center">
                <p class="text-slate-600 dark:text-slate-400">Don't have an account? <a href="register.html" class="text-primary-600 font-bold hover:underline">Sign up</a></p>
                <div class="mt-4">
                    <a href="../company/login.html" class="text-sm text-slate-500 hover:text-purple-600 flex items-center justify-center gap-2">
                        <i class="fas fa-building"></i> Are you a Company? Login here
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            // Simulate Authentication
            localStorage.setItem('currentUser', JSON.stringify({
                name: 'Mehedi Hasan',
                type: 'student',
                id: 'CSE-2022-001',
                email: 'mehedi@example.com'
            }));
            window.location.href = 'dashboard.html';
        });
    </script>
</body>
</html>
